[env]
CADENCE_ADMIN_EMAIL = "admin@example.com"
CADENCE_ADMIN_PASSWORD = "change-me"
CADENCE_ADMIN_DISPLAY_NAME = "Cadence Administrator"
CADENCE_ADMIN_MODE_TTL_SECONDS = "3600"
# Public credential for the loopback-only Earendil demo simulator.
EARENDIL_DEMO_PROVIDER_TOKEN = "earendil-local-provider"
OTEL_SERVICE_NAME = "cadence"
OTEL_RESOURCE_ATTRIBUTES = "deployment.environment.name=development"
OTEL_EXPORTER_OTLP_ENDPOINT = "http://localhost:4318"


[tasks.cadence]
dir = "apps/cadence_web"
run = "iex --sname cadence --cookie cadence -S mix phx.server"

[tasks.earendil-simulator]
description = "Run the local Earendil ground-network simulator"
dir = "apps/cadence_simulator"
run = "mix run --no-start --no-halt ../../dev/reflect_orbital_simulator.exs"

[tasks.earendil-live]
description = "Run ten Earendil telemetry feeds at 1 Hz and save the dashboard suite"
dir = "apps/cadence_simulator"
run = "elixir --hidden --sname earendil_tm --cookie cadence -S mix run --no-start ../../dev/reflect_orbital_live.exs"

[tools]
erlang = "latest"
hk = "1.56.0"
pkl = "latest"
elixir = "latest"
vp = "0.2.9"
