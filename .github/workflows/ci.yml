name: CI

# Elixir quality and test suites (docs/ci/plan.md). `ci-ok` is the single required check.

on:
  pull_request:
    branches: [develop, main]
    # A draft runs no CI: ready_for_review starts the run, converted_to_draft cancels a running one
    # through the concurrency group (docs/TEAM.md, #730).
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Pushes to develop/main write the caches PRs restore; let them finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MIX_ENV: test

jobs:
  changes:
    name: Detect code changes
    # Draft PRs run nothing (runner slots are the team's bottleneck, #730); ci-ok fails for them.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    # Pushes run everything. A PR runs the jobs its paths can affect:
    # - code: anything but docs (browser, console e2e, publication, JS audit)
    # - backend: code outside the console app and its kit (Elixir quality and suites). Elixir tests
    #   still execute frontend/apps/ops-console producer code and compile frontend/apps/host/src/routes.json,
    #   so those count.
    # - frontend: code outside the Elixir projects (frontend quality)
    # - scale: Console client, build, fixture and the scaled server entry points
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
      backend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.backend == 'true' }}
      frontend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true' }}
      scale: ${{ github.event_name != 'pull_request' || steps.filter.outputs.scale == 'true' }}
      merge_base_warning: ${{ steps.merge-base.outputs.warning }}
    steps:
      - name: Check PR merge base
        if: github.event_name == 'pull_request'
        id: merge-base
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          repo="repos/$GITHUB_REPOSITORY"
          printf 'Event base (%s): %s\n' "$BASE_REF" "$EVENT_BASE_SHA"

          # GITHUB_SHA pins the merge commit each test job checks out, including on reruns.
          if ! merge_base="$(timeout 15s gh api "$repo/git/commits/$GITHUB_SHA" --jq '.parents[0].sha // empty')" || [[ -z "$merge_base" ]]; then
            echo "::warning title=CI merge base unavailable::Could not read the first parent of $GITHUB_SHA."
            exit 0
          fi
          printf 'Tested merge base: %s\n' "$merge_base"

          if ! tip="$(timeout 15s gh api "$repo/git/ref/heads/$BASE_REF" --jq '.object.sha // empty')" || [[ -z "$tip" ]]; then
            echo "::warning title=CI merge base unavailable::Could not read the current $BASE_REF tip."
            exit 0
          fi
          printf 'Current %s tip: %s\n' "$BASE_REF" "$tip"
          if [[ "$merge_base" == "$tip" ]]; then
            exit 0
          fi

          age="$(timeout 15s gh api "$repo/git/commits/$merge_base" \
            --jq '([0, ((now - (.committer.date | fromdateiso8601)) / 60 | floor)] | max | tostring) + "m old"')" || age="age unavailable"
          commit_count="$(timeout 15s gh api --method GET "$repo/compare/$merge_base...$tip" -f per_page=1 \
            --jq '.ahead_by | "\(.) commit" + (if . == 1 then "" else "s" end)')" || commit_count=""
          tip_detail="Current $BASE_REF is $tip. Ahead count unavailable."
          if [[ -n "$commit_count" ]]; then
            tip_detail="$BASE_REF is $commit_count ahead at $tip."
          fi

          warning="CI built on $merge_base ($age). $tip_detail If a failure looks unrelated, rebase onto $BASE_REF and push. A rerun reuses this merge."
          printf '::warning title=CI merge base is stale::%s\n' "$warning"
          printf 'warning=%s\n' "$warning" >> "$GITHUB_OUTPUT"

      - if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - "**"
              - "!docs/**"
              - "!**/*.md"
            backend:
              - "**"
              - "!docs/**"
              - "!**/*.md"
              - "!frontend/apps/console/**"
              - "!frontend/packages/apogee-ui/**"
            frontend:
              - "**"
              - "!docs/**"
              - "!**/*.md"
              - "!apps/**"
              - "!packages/**"
              - "!config/**"
              - "!dev/**"
              - "!mix.exs"
              - "!mix.lock"
            scale:
              - "frontend/**"
              - ".github/**"
              - "scripts/ci/{source_index,tune_postgres}.sh"
              - "mise.toml"
              - "mix.{exs,lock}"
              - "apps/{cadence,cadence_web,cadence_simulator}/mix.{exs,lock}"
              - "config/{config,dev,runtime}.exs"
              - "apps/{cadence,cadence_web,cadence_simulator}/config/{config,dev,runtime}.exs"
              - "dev/reflect_orbital_simulator.exs"
              - "dev/reflect_orbital/{fixture,configuration,activation,live_contacts}.exs"
              - "dev/seed/**"
              - "dev/catalogs/demo_spacecraft.yaml"
              - "apps/cadence/lib/cadence/reads/{fleet_status,passes}.ex"
              - "apps/cadence_web/lib/cadence_web/controllers/console/{spa_controller,fleet_controller,fleet_json,pass_controller,pass_json}.ex"
              - "apps/cadence_web/lib/cadence_web/console/{shell,pass_list_params,window_page_params,window_params}.ex"
              - "apps/cadence_web/lib/cadence_web/channels/console_socket.ex"
              - "apps/cadence_web/lib/cadence_web/channels/console/{mission_channel,fleet_push,fleet_source}.ex"
              - "!**/*.md"

  repository-hygiene:
    name: Repository hygiene
    needs: changes
    if: needs.changes.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Local secret config stays ignored
        run: |
          test -z "$(git ls-files -- 'mise.local.toml' '**/mise.local.toml')"
          git check-ignore -q mise.local.toml
      - name: Scan PR commits for secrets
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          archive="$RUNNER_TEMP/gitleaks_8.21.2_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            '5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba' "$archive" \
            | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          config="$RUNNER_TEMP/base-gitleaks.toml"
          if git cat-file -e "$BASE_SHA:.gitleaks.toml" 2>/dev/null; then
            git show "$BASE_SHA:.gitleaks.toml" > "$config"
          else
            printf '[extend]\nuseDefault = true\n' > "$config"
          fi
          : > "$RUNNER_TEMP/empty-gitleaksignore"
          marker='gitleaks:'"allow"
          git log -p -m --format= --no-ext-diff "$base..$HEAD_SHA" -- . > "$RUNNER_TEMP/pr.patch"
          if awk -v marker="$marker" '/^\+[^+]/ && index($0, marker) { found=1 } END { exit found ? 0 : 1 }' \
            "$RUNNER_TEMP/pr.patch"; then
            echo '::error title=Forbidden scanner suppression::Remove the added scanner allow marker.'
            exit 1
          fi
          "$RUNNER_TEMP/gitleaks" git --no-banner --no-color --redact=100 --verbose \
            --ignore-gitleaks-allow --gitleaks-ignore-path "$RUNNER_TEMP/empty-gitleaksignore" \
            --config "$config" --log-opts="$base..$HEAD_SHA" .

  quality:
    name: Elixir quality
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup-cadence
        with:
          node: "false"
          xmllint: "false"

      # Each check runs even when an earlier one fails, so one run reports every problem.
      # A PR runs on its merge with develop, so two PRs that picked the same migration version fail
      # here as soon as the first lands (#767/#769 on 11-26).
      - name: Migration versions are unique and follow the baseline
        if: ${{ !cancelled() }}
        run: |
          status=0
          for dir in apps/cadence/priv/repo/migrations apps/cadence/priv/questdb/migrations; do
            [ -d "$dir" ] || continue
            dupes=$(ls "$dir" | sed -n 's/^\([0-9]\{14\}\)_.*/\1/p' | sort | uniq -d)
            for version in $dupes; do
              echo "::error title=Duplicate migration version::$dir: $(ls "$dir" | grep "^$version" | tr '\n' ' ')"
              status=1
            done
          done
          baseline=20261126190001
          for file in apps/cadence/priv/repo/migrations/[0-9]*.exs; do
            [ -f "$file" ] || continue
            version=$(basename "$file" | cut -c1-14)
            if [ "$version" -lt "$baseline" ]; then
              echo "::error title=Migration precedes #718 baseline::$file must have a version after $baseline; re-time-stamp this PR's migration"
              status=1
            fi
          done
          exit "$status"
      - name: Compile every project (warnings as errors)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        # The restored _build makes this an incremental build. When a struct in one project gains
        # or loses a field, an incremental build of a project that depends on it can keep a stale
        # inferred type and report a false "incompatible types" warning (cadence_web after
        # 64387fb7e's RawEvidence.receipt_times; reproduced locally). So a failure is checked
        # again by a forced full build, and only that build's result counts. A real warning
        # fails both builds.
        run: |
          if mix workspace.run -t compile --order postorder --early-stop --env-var MIX_ENV=test -- --warnings-as-errors; then
            exit 0
          fi
          echo "::warning title=Incremental compile failed::Checking again with a forced full build (stale build-cache types can cause false warnings)."
          mix workspace.run -t compile --order postorder --early-stop --env-var MIX_ENV=test -- --force --warnings-as-errors
      - name: Compile dev scripts without running entrypoints
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: apps/cadence_simulator
        env:
          MIX_ENV: test
        run: mix run --no-start --no-compile ../../scripts/ci/check_dev_scripts.exs
      - name: Format
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: mix format.all --check-formatted
      - name: Credo (strict, zero issues)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: mix credo --strict
      - name: No new credo suppressions
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && github.event_name == 'pull_request' }}
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          scripts/ci/credo_suppressions.sh FETCH_HEAD HEAD
      - name: Workspace check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: mix workspace.check
      - name: Extensions check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: mix workspace.run -t cadence.extensions.check -p cadence --order postorder --early-stop --env-var MIX_ENV=test --
      - name: Architecture check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: mix workspace.run -t cadence.architecture.check -p cadence --order postorder --early-stop --env-var MIX_ENV=test -- --summary
      # Every project: child locks hold deps the root lock lacks (e.g. ccsds/xtce's ex_doc).
      # Blocking: a retired package or a security advisory in any lock fails the PR.
      - name: Hex audit, every project
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          status=0
          mix hex.audit || status=1
          mix workspace.run -t hex.audit --order postorder || status=1
          exit "$status"

      # Only develop/main pushes save caches; PRs restore the latest one and never churn the quota.
      # This job compiles every project, so it alone saves _build.
      - name: Save deps
        if: ${{ github.event_name == 'push' && steps.setup.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CADENCE_DEPS_PATHS }}
          key: ${{ env.CADENCE_DEPS_KEY }}
      - name: Index the sources this _build was compiled from
        if: ${{ github.event_name == 'push' && steps.setup.outcome == 'success' }}
        run: scripts/ci/source_index.sh write "$CADENCE_SOURCE_INDEX"
      - name: Save _build
        if: ${{ github.event_name == 'push' && steps.setup.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CADENCE_BUILD_PATHS }}
          key: ${{ env.CADENCE_BUILD_KEY }}

  test-core:
    name: Core tests (${{ matrix.partition }}/2)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Two, not four: each job pays ~2.5 min of setup, and runner slots are the bottleneck (#730).
        partition: [1, 2]
    env:
      MIX_TEST_PARTITION: ${{ matrix.partition }}
    services:
      postgres:
        # Keep the image's default en_US.utf8 collation (glibc, linguistic), as production
        # databases have; don't switch it to C. It caught a real bug that C-collated local
        # databases hide (03e701ce: artifact order followed the collation).
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Tune Postgres for throwaway test data
        run: scripts/ci/tune_postgres.sh
      - uses: ./.github/actions/setup-cadence
      - name: mix test --partitions 2
        working-directory: apps/cadence
        run: mix test --partitions 2 --slowest-modules 10
      - name: Save pnpm store
        if: github.event_name == 'push' && matrix.partition == 1
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CADENCE_PNPM_STORE }}
          key: pnpm-v1-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

  test-web:
    name: Web tests (${{ matrix.partition }}/2)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2]
    env:
      MIX_TEST_PARTITION: ${{ matrix.partition }}
    services:
      postgres:
        # Keep the image's default en_US.utf8 collation (glibc, linguistic), as production
        # databases have; don't switch it to C. It caught a real bug that C-collated local
        # databases hide (03e701ce: artifact order followed the collation).
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Tune Postgres for throwaway test data
        run: scripts/ci/tune_postgres.sh
      - uses: ./.github/actions/setup-cadence
      # cadence_web uses Cadence.Repo but, unlike apps/cadence, has no DB setup alias.
      - name: Create and migrate the cadence test database
        working-directory: apps/cadence
        run: mix db.setup.test
      # :browser and :browser_smoke stay excluded (test_helper.exs); the Frontend workflow runs
      # them. :frontend_publication runs in test-web-publication, which builds its input.
      - name: mix test --partitions 2
        working-directory: apps/cadence_web
        run: mix test --partitions 2 --exclude frontend_publication --slowest-modules 10

  test-web-publication:
    name: Web tests needing the federation publication
    needs: [changes, browser-assets]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        # Keep the image's default en_US.utf8 collation (glibc, linguistic), as production
        # databases have; don't switch it to C. It caught a real bug that C-collated local
        # databases hide (03e701ce: artifact order followed the collation).
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Tune Postgres for throwaway test data
        run: scripts/ci/tune_postgres.sh
      - uses: ./.github/actions/setup-cadence
      # cadence_web uses Cadence.Repo but, unlike apps/cadence, has no DB setup alias.
      - name: Create and migrate the cadence test database
        working-directory: apps/cadence
        run: mix db.setup.test
      - name: Download the browser assets (built once by browser-assets)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-assets
          path: apps/cadence_web/priv/static
      - name: mix test --only frontend_publication
        working-directory: apps/cadence_web
        shell: bash
        run: |
          mix test --only frontend_publication 2>&1 | tee "$RUNNER_TEMP/web-publication.log"
          # --only passes when nothing matches; these tests must run, never silently skip.
          grep -Eq '^Result: [1-9][0-9]* passed' "$RUNNER_TEMP/web-publication.log" ||
            { echo "::error::No :frontend_publication test ran"; exit 1; }

  # The federation publication and digests (assets.deploy), built once for test-web-publication
  # and console-e2e.
  browser-assets:
    name: Browser assets (built once)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cadence
        with:
          xmllint: "false"
      - name: Build the browser assets (mix assets.deploy, behind the publication build lock)
        working-directory: apps/cadence_web
        run: node ../../frontend/tools/phoenix/run_federation_publication_build.mjs assets.deploy
      # The browser smokes sign in through the console's sign-in API, which needs the CSRF meta of
      # the console document (priv/static/console/index.html, uploaded with the rest below).
      - name: Build the console (the browser smokes' sign-in document)
        working-directory: frontend
        run: |
          if [ ! -f apps/console/package.json ]; then
            echo "No console on this branch."
            exit 0
          fi
          corepack pnpm --filter @cadence/console run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-assets
          path: apps/cadence_web/priv/static
          if-no-files-found: error
          retention-days: 1

  # #242: the console's Playwright specs (e2e and a11y) against a real stack, one per shard.
  # Required through ci-ok (#409). A flaky spec goes to console to fix; it is not a reason to ungate.
  # Each shard boots its own Postgres, QuestDB, simulator and Phoenix and seeds them (devops on
  # #242: the simulator keeps its own reservations, so a restored dump wouldn't match it).
  # Credentials (lead, director): each shard makes its own random passwords, masked, kept in this
  # job's env only; nothing passes between jobs and nothing is stored. Sign-in goes through the API
  # (no typed password in a trace), and a leak check gates every upload.
  console-e2e:
    name: Console e2e (${{ matrix.shard }}/2)
    needs: [changes, browser-assets]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Two, not four: a shard spends ~5 min on setup, compile and seeds and ~1.5 min on specs (#730).
        shard: [1, 2]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      questdb:
        image: questdb/questdb:9.4.3
        ports:
          - 9000:9000
          - 8812:8812
          - 9009:9009
    env:
      MIX_ENV: dev
      CADENCE_DEV_DATABASE: cadence_e2e
      CADENCE_QUESTDB_HTTP_ENDPOINT: http://127.0.0.1:9000
      CADENCE_QUESTDB_HOST: 127.0.0.1
      CADENCE_QUESTDB_PORT: "8812"
      EARENDIL_SIMULATOR_PORT: "4111"
      EARENDIL_PROVIDER_URL: http://127.0.0.1:4111
      # The public demo token (mise.toml), not a secret.
      EARENDIL_DEMO_PROVIDER_TOKEN: earendil-local-provider
      EARENDIL_INGRESS_BASE_PORT: "43100"
      EARENDIL_UPLINK_BASE_PORT: "48100"
      # The REST seed saves configuration drafts but never approves their activation in e2e.
      # E2E_MUTATE stays unset; the director 11-18 specs own their own activation changes.
      EARENDIL_SEED_APPROVE_CONFIGURATION: "0"
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      # Serve the built console from priv/static/console (browser-assets), not a Vite dev server.
      CONSOLE_VITE_ORIGIN: ""
      PORT: "4402"
      CADENCE_ADMIN_EMAIL: ci-admin@example.invalid
      CADENCE_ADMIN_DISPLAY_NAME: CI Administrator
      # No dev code reloader or asset watchers on this server (apps/cadence_web/config/dev.exs).
      CADENCE_CI_SERVER: "1"
      BASE_URL: http://127.0.0.1:4402
      E2E_WORKERS: "2"
      CI: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Allow Chrome's sandbox to create user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Tune Postgres for throwaway test data
        run: scripts/ci/tune_postgres.sh
      - uses: ./.github/actions/setup-cadence
      - name: Download the browser assets (with the built console)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: browser-assets
          path: apps/cadence_web/priv/static
      - uses: ./.github/actions/playwright-chromium
      - name: Compile the app and the simulator (MIX_ENV=dev)
        run: |
          (cd apps/cadence_web && mix compile)
          (cd apps/cadence_simulator && mix compile)
      # devops on #624: only quality saves _build, and only for test, so save the dev build from
      # shard 1 on pushes; PR runs restore the newest one through setup-cadence's restore-keys.
      - name: Index the sources this dev _build was compiled from
        if: ${{ github.event_name == 'push' && matrix.shard == 1 }}
        run: scripts/ci/source_index.sh write "$CADENCE_SOURCE_INDEX"
      - name: Save the dev _build
        if: ${{ github.event_name == 'push' && matrix.shard == 1 }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CADENCE_BUILD_PATHS }}
          key: ${{ env.CADENCE_BUILD_KEY }}
      # Lead and the director: made here, masked, and kept in this job's env only. Before any mix
      # command that loads runtime config: CADENCE_ADMIN_EMAIL and _PASSWORD must be set together
      # (devops' first run). After the dev _build save, so no password exists while it's cached.
      - name: Make this shard's passwords
        run: |
          set +x
          admin=$(openssl rand -base64 30 | tr -d '/+=')
          persona=$(openssl rand -base64 30 | tr -d '/+=')
          echo "::add-mask::$admin"
          echo "::add-mask::$persona"
          echo "CADENCE_ADMIN_PASSWORD=$admin" >> "$GITHUB_ENV"
          echo "E2E_PERSONA_PASSWORD=$persona" >> "$GITHUB_ENV"
      - name: Create and migrate the database and QuestDB
        working-directory: apps/cadence_web
        run: mix ecto.create -r Cadence.Repo && mix ecto.migrate -r Cadence.Repo && mix cadence.questdb.migrate
      - name: Start the simulator
        working-directory: apps/cadence_simulator
        run: |
          rm -rf ../../var/reflect_orbital
          (mix run --no-start --no-halt ../../dev/reflect_orbital_simulator.exs > "$RUNNER_TEMP/simulator.log" 2>&1 &)
          curl --retry-connrefused --retry 60 --retry-delay 1 -s -o /dev/null http://127.0.0.1:4111/
      # Boot creates or updates the environment admin from CADENCE_ADMIN_EMAIL and _PASSWORD.
      - name: Start Phoenix
        working-directory: apps/cadence_web
        run: |
          (mix phx.server > "$RUNNER_TEMP/server.log" 2>&1 &)
          curl --retry-connrefused --retry 120 --retry-delay 1 -fsS -o /dev/null http://127.0.0.1:4402/console/sign-in
          curl -fsS -o /dev/null http://127.0.0.1:4402/console/
      - name: Seed the demo and QA missions through REST (timed)
        run: |
          start=$SECONDS
          MIX_INSTALL_DIR="$RUNNER_TEMP/mix-install" elixir dev/seed/earendil.exs
          MIX_INSTALL_DIR="$RUNNER_TEMP/mix-install" elixir dev/seed/qa.exs
          echo "E2E_ORG_ID=$(sed -n '1p' var/stack/seed.ids)" >> "$GITHUB_ENV"
          echo "E2E_MISSION_ID=$(sed -n '2p' var/stack/seed.ids)" >> "$GITHUB_ENV"
          echo "REST seed wall: $((SECONDS - start)) s"
      - name: Console specs (this shard)
        id: specs
        working-directory: frontend/apps/console
        run: >-
          corepack pnpm exec playwright test --shard=${{ matrix.shard }}/2
          --project=desktop --project=a11y-desktop-admin --project=a11y-desktop-member
          --project=a11y-phone-admin --project=a11y-phone-member
      # #176: the fleet-scale budgets are timings, so they run alone with one worker, on the shard
      # without the serial specs. Like the serial run, the main run's evidence moves aside first.
      - name: Console fleet-scale budgets
        if: ${{ !cancelled() && matrix.shard == 2 && needs.changes.outputs.scale == 'true' }}
        working-directory: frontend/apps/console
        run: |
          if [ -d test-results ]; then mv test-results test-results-main; fi
          if [ -d playwright-report ]; then mv playwright-report playwright-report-main; fi
          corepack pnpm exec playwright test --project=scale --workers=1
      # docs/apogee/qa/e2e.md §1: specs that stage a change set run alone, on one shard.
      # A second playwright run clears test-results and rewrites playwright-report, so the main run's
      # evidence (traces, snapshots, its report) moves aside first and both sets are scanned and
      # uploaded (found on #652: shard 1 uploaded only the serial run).
      - name: Console specs that stage a change set (serial)
        if: ${{ !cancelled() && matrix.shard == 1 }}
        working-directory: frontend/apps/console
        run: |
          if [ -d test-results ]; then mv test-results test-results-main; fi
          if [ -d playwright-report ]; then mv playwright-report playwright-report-main; fi
          corepack pnpm exec playwright test --project=desktop-serial --workers=1
      - name: No password in any file to upload
        id: leakcheck
        if: ${{ !cancelled() }}
        shell: bash
        # Fails closed (ca-security on #624): a trace that won't unpack, or a scan that errors, blocks
        # the upload just as a match does. Nothing about the files or the match is printed.
        run: |
          set +x
          set -euo pipefail
          scan="$RUNNER_TEMP/leakscan"
          mkdir -p "$scan"
          cd frontend/apps/console
          paths=()
          for p in playwright-report test-results playwright-report-main test-results-main "$RUNNER_TEMP/server.log" "$RUNNER_TEMP/simulator.log"; do
            if [ -e "$p" ]; then paths+=("$p"); fi
          done
          # Traces are zips: unpack them so their JSON and network logs are scanned too.
          while IFS= read -r -d '' z; do
            if ! unzip -qo "$z" -d "$scan/$(basename "$z" .zip)-$RANDOM" >/dev/null 2>&1; then
              echo "::error title=credential leak check::a trace couldn't be unpacked for the scan; upload blocked"
              exit 1
            fi
          done < <(find playwright-report test-results playwright-report-main test-results-main -name '*.zip' -print0 2>/dev/null || true)
          paths+=("$scan")
          # A shard that failed before its passwords existed has nothing secret to find (devops).
          # Skip an empty one: grep -F with an empty pattern matches everything.
          for secret in "${CADENCE_ADMIN_PASSWORD:-}" "${E2E_PERSONA_PASSWORD:-}"; do
            if [ -z "$secret" ]; then continue; fi
            rc=0
            grep -r -a -F -q -- "$secret" "${paths[@]}" >/dev/null 2>&1 || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "::error title=credential leak::a run password appears in a file to be uploaded; upload blocked (file and match not printed)"
              exit 1
            elif [ "$rc" -ne 1 ]; then
              echo "::error title=credential leak check::the scan failed (grep exit $rc); upload blocked"
              exit 1
            fi
          done
          echo "leak check: no run password in any file to be uploaded"
      # ux (#242): the report and its screenshots on every run, for word review from the artifact.
      # Every path here must be in the leak check's list above.
      - name: Upload the Playwright report, results and stack logs
        if: ${{ !cancelled() && steps.leakcheck.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: console-e2e-${{ matrix.shard }}
          path: |
            frontend/apps/console/playwright-report
            frontend/apps/console/test-results
            frontend/apps/console/playwright-report-main
            frontend/apps/console/test-results-main
            ${{ runner.temp }}/server.log
            ${{ runner.temp }}/simulator.log
          if-no-files-found: ignore
          retention-days: 7

  test-packages:
    name: Packages, simulator, planes and cluster tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        # Keep the image's default en_US.utf8 collation (glibc, linguistic), as production
        # databases have; don't switch it to C. It caught a real bug that C-collated local
        # databases hide (03e701ce: artifact order followed the collation).
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Tune Postgres for throwaway test data
        run: scripts/ci/tune_postgres.sh
      - id: setup
        uses: ./.github/actions/setup-cadence
        with:
          node: "false"

      # Each suite runs even when an earlier one fails, so one run reports every problem.
      - name: ccsds
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: packages/ccsds
        run: mix test
      - name: xtce
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: packages/xtce
        run: mix test
      - name: sgp4
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: packages/sgp4
        run: mix test
      - name: cadence_catalog
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: packages/cadence_catalog
        run: mix test
      # The simulator suite uses Cadence.Repo but, unlike apps/cadence, has no DB setup alias.
      - name: Create and migrate the cadence test database
        id: db
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        working-directory: apps/cadence
        run: mix db.setup.test
      - name: cadence_simulator
        if: ${{ !cancelled() && steps.db.outcome == 'success' }}
        working-directory: apps/cadence_simulator
        run: mix test
      - name: Plane tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: mix test.planes
      - name: OTP cluster tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: mix test.cluster

  # Lockfile-only, so no install. A new HIGH/CRITICAL advisory in a production dependency fails
  # the PR; dev tooling is reported but doesn't block (docs/ci: audit gating, 2026-11-13).
  js-audit:
    name: JS dependency audit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.16.0"
      - run: corepack enable
      - name: frontend (pnpm), production deps, HIGH and above
        working-directory: frontend
        run: corepack pnpm audit --prod --audit-level high
      - name: All dependencies incl. dev tooling (reported, not blocking)
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### JS advisories, all dependencies (not blocking)"
            echo '```'
            (cd frontend && corepack pnpm audit --audit-level moderate 2>&1 | tail -3) || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The frontend workspace's own gate: pnpm verify (vp check, typecheck, structural lint, unit
  # tests). Moved from frontend.yml so it can be part of ci-ok.
  frontend-quality:
    name: Frontend quality
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.16.0"
      # OTP and Elixir versions come from mise.toml.
      - uses: ./.github/actions/setup-beam
      # The console consumes the locked Phoenix JavaScript package.
      - run: mix deps.get --check-locked
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
        working-directory: frontend
      - uses: ./.github/actions/playwright-chromium
      - run: corepack pnpm verify
        working-directory: frontend

  # Production reads and writes telemetry through QuestDB, but the test env swaps every
  # telemetry store for Postgres. This job runs against a real QuestDB (docs/ci/questdb-integration.md).
  # Required through ci-ok since #491's fix (#566) landed (director 11-19; docs/ci/questdb-integration.md).
  questdb-integration:
    name: QuestDB integration
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CADENCE_QUESTDB_HTTP_ENDPOINT: http://127.0.0.1:9000
      CADENCE_QUESTDB_HOST: 127.0.0.1
      CADENCE_QUESTDB_PORT: "8812"
    services:
      questdb:
        # Same version as docker-compose.yml, pinned to the 9.4.3 multi-arch index digest.
        image: questdb/questdb:9.4.3@sha256:3fd139f9f16015afc1b064fe4591b271be26cdec10315415e5511e9d80a5919e
        ports:
          - 9000:9000
          - 8812:8812
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9003/"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      postgres:
        # For the :questdb ExUnit suite (Repo sandbox); keep en_US.utf8, as in test-core.
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cadence
        with:
          node: "false"
          xmllint: "false"
      - name: Apply the QuestDB schema migrations
        working-directory: apps/cadence
        run: mix cadence.questdb.migrate
      - name: QuestDB round trip (write, then read history, decimation and watermark)
        working-directory: apps/cadence
        run: mix cadence.questdb.smoke
      # Tests tagged :questdb (excluded from the normal suites by test_helper.exs) run here. Until
      # the first one exists this step only reports that; adding one needs no workflow change.
      - name: mix test --only questdb
        working-directory: apps/cadence
        run: |
          if ! grep -rqE '@(module)?tag[[:space:]]+:questdb\b' test; then
            echo "No :questdb-tagged tests yet."
            exit 0
          fi
          mix test --only questdb --slowest-modules 10

  # The test env runs with the ingress journal on, but production's default is off (config.exs).
  # This reruns the ingest tests tagged @moduletag :ingest_journal_matrix with it off (director
  # 11-14; api-ops 3c94a9853). Journal-only tests in those modules skip themselves, visibly.
  # Required through ci-ok since 2026-11-19: no flake in its probation (docs/ci/questdb-integration.md, "Joined ci-ok").
  ingest-journal-off:
    name: Ingest tests, journal off
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # Keep en_US.utf8, as in test-core.
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Tune Postgres for throwaway test data
        run: scripts/ci/tune_postgres.sh
      - uses: ./.github/actions/setup-cadence
        with:
          node: "false"
      # The tag reaches develop with ui/apogee-spa. Until a branch has it, this step only reports that.
      - name: mix test --only ingest_journal_matrix (journal off)
        working-directory: apps/cadence
        env:
          CADENCE_TEST_INGRESS_JOURNAL: "off"
        run: |
          if ! grep -rqE '@moduletag[[:space:]]+:ingest_journal_matrix\b' test; then
            echo "No :ingest_journal_matrix tests on this branch yet."
            exit 0
          fi
          mix test --only ingest_journal_matrix --slowest-modules 10

  # #743: exercise the public seed path on a fresh server. One small fleet, one runner, no
  # browser dependencies. MIX_ENV=dev and setup-cadence use the same deps/_build keys as
  # console-e2e, whose develop push saves the dev build (#730).
  rest-seed-smoke:
    name: REST seed smoke
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      questdb:
        image: questdb/questdb:9.4.3
        ports:
          - 9000:9000
          - 8812:8812
          - 9009:9009
    env:
      MIX_ENV: dev
      CADENCE_DEV_DATABASE: cadence_rest_seed_smoke
      CADENCE_QUESTDB_HTTP_ENDPOINT: http://127.0.0.1:9000
      CADENCE_QUESTDB_HOST: 127.0.0.1
      CADENCE_QUESTDB_PORT: "8812"
      EARENDIL_SIMULATOR_PORT: "4111"
      EARENDIL_PROVIDER_URL: http://127.0.0.1:4111
      EARENDIL_DEMO_PROVIDER_TOKEN: earendil-local-provider
      EARENDIL_INGRESS_BASE_PORT: "43100"
      EARENDIL_UPLINK_BASE_PORT: "48100"
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      CONSOLE_VITE_ORIGIN: ""
      PORT: "4402"
      BASE_URL: http://127.0.0.1:4402
      CADENCE_ADMIN_EMAIL: ci-rest-admin@example.invalid
      CADENCE_ADMIN_DISPLAY_NAME: CI REST Administrator
      CADENCE_CI_SERVER: "1"
      CI: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Tune Postgres for throwaway test data
        run: scripts/ci/tune_postgres.sh
      - uses: ./.github/actions/setup-cadence
        with:
          node: "false"
          xmllint: "false"
      - name: Compile the app and simulator from the dev build cache
        run: |
          (cd apps/cadence_web && mix compile)
          (cd apps/cadence_simulator && mix compile)
      - name: Make an ephemeral admin password
        run: |
          set +x
          password=$(openssl rand -base64 30 | tr -d '/+=')
          persona=$(openssl rand -base64 30 | tr -d '/+=')
          echo "::add-mask::$password"
          echo "::add-mask::$persona"
          echo "CADENCE_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "E2E_PERSONA_PASSWORD=$persona" >> "$GITHUB_ENV"
      # The REST client reads the CSRF meta tag from this route; no JS or browser assets run.
      - name: Supply a minimal console shell for CSRF bootstrap
        run: |
          mkdir -p apps/cadence_web/priv/static/console
          printf '<!doctype html><html><head></head><body></body></html>\n' > apps/cadence_web/priv/static/console/index.html
      - name: Migrate the empty Postgres and QuestDB stores
        working-directory: apps/cadence_web
        run: mix ecto.create -r Cadence.Repo && mix ecto.migrate -r Cadence.Repo && mix cadence.questdb.migrate
      - name: Start the simulator
        working-directory: apps/cadence_simulator
        run: |
          rm -rf ../../var/reflect_orbital
          (mix run --no-start --no-halt ../../dev/reflect_orbital_simulator.exs > "$RUNNER_TEMP/simulator.log" 2>&1 &)
          curl --retry-connrefused --retry 60 --retry-delay 1 -s -o /dev/null http://127.0.0.1:4111/
      - name: Start Phoenix and bootstrap the admin
        working-directory: apps/cadence_web
        run: |
          (mix phx.server > "$RUNNER_TEMP/server.log" 2>&1 &)
          curl --retry-connrefused --retry 120 --retry-delay 1 -fsS -o /dev/null http://127.0.0.1:4402/health/ready
          curl -fsS -o /dev/null http://127.0.0.1:4402/console/sign-in
      - name: Seed Earendil and QA fixtures through REST
        shell: bash
        run: |
          set -euo pipefail
          start=$SECONDS
          EARENDIL_SPACECRAFT_COUNT=10 EARENDIL_SITE_COUNT=2 MIX_INSTALL_DIR="$RUNNER_TEMP/mix-install" \
            elixir dev/seed/earendil.exs | tee "$RUNNER_TEMP/rest-seed.log"
          grep -Eq '^Earendil fleet: in_review \(10 spacecraft,' "$RUNNER_TEMP/rest-seed.log"
          MIX_INSTALL_DIR="$RUNNER_TEMP/mix-install" \
            elixir dev/seed/qa.exs | tee -a "$RUNNER_TEMP/rest-seed.log"
          grep -q 'qa-mission-23566: mission and catalog present' "$RUNNER_TEMP/rest-seed.log"
          echo "REST seed wall: $((SECONDS - start)) s"
      - name: Show server and simulator logs on failure
        if: ${{ failure() }}
        run: |
          for log in "$RUNNER_TEMP/server.log" "$RUNNER_TEMP/simulator.log"; do
            if [ -f "$log" ]; then
              echo "::group::$(basename "$log") tail"
              tail -n 80 "$log"
              echo "::endgroup::"
            fi
          done

  ci-ok:
    name: ci-ok
    needs:
      [
        changes,
        repository-hygiene,
        quality,
        test-core,
        test-web,
        browser-assets,
        test-web-publication,
        test-packages,
        js-audit,
        frontend-quality,
        ingest-journal-off,
        questdb-integration,
        rest-seed-smoke,
        console-e2e,
      ]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report stale PR merge base
        if: ${{ !cancelled() && needs.changes.outputs.merge_base_warning != '' }}
        env:
          MERGE_BASE_WARNING: ${{ needs.changes.outputs.merge_base_warning }}
        run: printf '%s\n' "$MERGE_BASE_WARNING" >> "$GITHUB_STEP_SUMMARY"
      - name: A draft PR is not checked
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        run: |
          echo "::error::Draft PRs run no CI. Mark the PR ready for review to run it."
          exit 1
      - name: Every needed job succeeded or was skipped as unaffected
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
