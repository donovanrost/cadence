name: Frontend

on:
  pull_request:
  push:
    # Pushes to develop/main keep a record of Frontend quality on the merged code.
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MIX_ENV: test
  ERL_FLAGS: "+S 4:4"

jobs:
  quality:
    name: Frontend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.16.0"
      # OTP and Elixir versions come from mise.toml.
      - uses: ./.github/actions/setup-beam
      # The frontend consumes the locked Phoenix and LiveVue JavaScript packages.
      - run: mix deps.get --check-locked
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
        working-directory: frontend
      - run: corepack pnpm exec playwright install --with-deps chromium chrome
        working-directory: frontend
      - run: corepack pnpm verify
        working-directory: frontend
