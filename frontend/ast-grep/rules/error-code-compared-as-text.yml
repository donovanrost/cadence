{
  "id": "error-code-compared-as-text",
  "language": "TypeScript",
  "severity": "error",
  "message": "Compare server error codes with isError(e, \"code\") from @/api: the code is checked against the known vocabulary (typing plan §12 A2).",
  "rule":
    {
      "any":
        [
          { "pattern": "$E.code === $S" },
          { "pattern": "$E.code !== $S" },
          { "pattern": "$S === $E.code" },
          { "pattern": "\"code\" in $E" },
          { "pattern": "'code' in $E" },
        ],
    },
  "constraints": { "E": { "regex": "^(e|err|error|[A-Za-z_.?]*[Ee]rror)$" } },
  "files": ["apps/console/src/**"],
  "ignores":
    [
      "apps/console/src/api/**",
      "**/*.test.ts",
      "ast-grep/fixtures/**",
      # Not migrated yet (BACKLOG §12B): each owner removes their file when they switch to isError.
      "apps/console/src/features/account/api.ts",
      "apps/console/src/features/account/invitations.ts",
      "apps/console/src/features/apps/hostBridge.ts",
      "apps/console/src/features/apps/surfaces.ts",
      "apps/console/src/features/auth/InvitationScreen.vue",
      "apps/console/src/features/auth/SignInScreen.vue",
      "apps/console/src/features/commands/compose/useComposeDraft.ts",
      "apps/console/src/features/commands/compose/useSubmit.ts",
      "apps/console/src/features/commands/groups/encoding.ts",
      "apps/console/src/features/commands/request/DecisionPanel.vue",
      "apps/console/src/features/contacts/attention.ts",
      "apps/console/src/features/contacts/AttentionBlock.vue",
      "apps/console/src/features/contacts/BookPassSheet.vue",
      "apps/console/src/features/contacts/readiness.ts",
      "apps/console/src/features/contacts/release.ts",
      "apps/console/src/features/dashboards/editor/api.ts",
      "apps/console/src/features/dashboards/library/api.ts",
      "apps/console/src/features/dashboards/library/RenameSheet.vue",
      "apps/console/src/features/dashboards/library/RetireSheet.vue",
      "apps/console/src/features/dashboards/shared/api.ts",
      "apps/console/src/features/mobile/YourGoBlock.vue",
      "apps/console/src/features/now/useQueueCommand.ts",
      "apps/console/src/features/people/admin.ts",
      "apps/console/src/features/people/services.ts",
      "apps/console/src/features/replan/errors.ts",
      "apps/console/src/features/resolutions/api.ts",
    ],
}
