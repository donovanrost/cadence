# Attitude Drift Test Scenario
#
# This scenario tests attitude limit alarms by simulating gradual drift
# in spacecraft orientation. Tests:
# - Roll limit warning at 45 degrees (yellow_high)
# - Roll limit critical at 180 degrees (red_high)
# - Attitude correction maneuver
#
# Uses demo_spacecraft.yaml packet definitions:
# - ADCS packet (APID 30) for attitude telemetry
#
# Usage:
#   mix cadence.simulate -m <mission-id> \
#     --scenario priv/scenarios/attitude_drift.yaml \
#     --definitions priv/databases/demo_spacecraft.yaml \
#     --output tcp:localhost:9000 \
#     --start-mission

version: "1.0"
name: "Attitude Drift Test"
description: "Tests attitude limit alarms during orientation drift and correction"
target_id: "SIM-1"
step_rate_hz: 1.0

baseline:
  # ADCS packet baseline values - quaternion and Euler angles
  ADCS.q_w: 1.0
  ADCS.q_x: 0.0
  ADCS.q_y: 0.0
  ADCS.q_z: 0.0
  ADCS.roll: 0.0
  ADCS.pitch: 0.0
  ADCS.yaw: 0.0
  ADCS.roll_rate: 0.0
  ADCS.pitch_rate: 0.0
  ADCS.yaw_rate: 0.0
  ADCS.rw1_speed: 1000.0
  ADCS.rw2_speed: 1000.0
  ADCS.rw3_speed: 1000.0
  ADCS.adcs_mode: "NADIR_POINT"
  ADCS.adcs_error: "NONE"

  # HK packet for context
  HK.sc_mode: "NOMINAL"

timeline:
  # Phase 1: Nominal attitude
  - step: 0
    description: "Nominal attitude - all axes centered"

  # Phase 2: Begin drift - disturbance torque
  - step: 10
    description: "Disturbance detected - roll drift beginning"
    inject:
      ADCS.roll:
        type: ramp
        from: 0.0
        to: 60.0
        steps: 30
        noise: 0.5
      ADCS.roll_rate: 2.0
      ADCS.adcs_mode: "DETUMBLE"
      ADCS.rw1_speed:
        type: ramp
        from: 1000.0
        to: 4500.0
        steps: 30

  # Phase 3: Warning threshold crossed (45 deg yellow_high)
  - step: 25
    description: "Roll warning threshold crossed (45 deg)"
    inject:
      ADCS.adcs_error: "MOMENTUM_LIMIT"

  # Phase 4: Momentum saturation approaching
  - step: 35
    description: "Reaction wheel momentum building - nearing saturation"
    inject:
      ADCS.roll: 55.0
      ADCS.rw1_speed: 5200.0  # Approaching limit
      ADCS.rw2_speed: 4800.0
      ADCS.rw3_speed: 4500.0

  # Phase 5: Correction maneuver starts (momentum dump)
  - step: 40
    description: "Momentum dump and correction maneuver initiated"
    inject:
      ADCS.roll_rate: -3.0  # Correcting
      ADCS.roll:
        type: ramp
        from: 55.0
        to: 0.0
        steps: 25
        noise: 0.3
      ADCS.adcs_mode: "SUN_POINT"
      ADCS.rw1_speed:
        type: ramp
        from: 5200.0
        to: 1000.0
        steps: 25
      ADCS.rw2_speed:
        type: ramp
        from: 4800.0
        to: 1000.0
        steps: 25
      ADCS.rw3_speed:
        type: ramp
        from: 4500.0
        to: 1000.0
        steps: 25

  # Phase 6: Below warning threshold
  - step: 55
    description: "Roll below warning threshold"
    inject:
      ADCS.adcs_error: "NONE"

  # Phase 7: Back to nominal
  - step: 65
    description: "Attitude restored to nominal"
    inject:
      ADCS.roll: 0.0
      ADCS.roll_rate: 0.0
      ADCS.adcs_mode: "NADIR_POINT"
      ADCS.rw1_speed: 1000.0
      ADCS.rw2_speed: 1000.0
      ADCS.rw3_speed: 1000.0

  - step: 75
    end: true
