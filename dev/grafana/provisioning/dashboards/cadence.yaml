apiVersion: 1

providers:
  - name: Cadence
    orgId: 1
    folder: Cadence
    folderUid: cadence
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: false
