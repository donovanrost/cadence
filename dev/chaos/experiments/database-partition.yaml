apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: cadence-database-partition
  namespace: cadence-chaos
spec:
  action: partition
  mode: one
  selector:
    namespaces: [cadence-chaos]
    labelSelectors:
      app: cadence
      cadence-lab: "true"
  direction: both
  target:
    mode: all
    selector:
      namespaces: [cadence-chaos]
      labelSelectors:
        app: postgres
        cadence-lab: "true"
  duration: "30s"
