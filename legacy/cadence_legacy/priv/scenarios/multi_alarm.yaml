# Multi-Alarm Cascade Test Scenario
#
# This scenario tests the alarm system's ability to handle multiple
# simultaneous alarms across different subsystems. Simulates a complex
# failure mode where power issues cascade into thermal and attitude problems.
#
# Tests alarms across:
# - EPS: Battery voltage, solar array output
# - THERM: OBC temperature, battery temperature
# - ADCS: Roll/pitch angles, reaction wheel speeds
# - COMM: Link state, signal strength
#
# Uses demo_spacecraft.yaml packet definitions
#
# Usage:
#   mix cadence.simulate -m <mission-id> \
#     --scenario priv/scenarios/multi_alarm.yaml \
#     --definitions priv/databases/demo_spacecraft.yaml \
#     --output tcp:localhost:9000 \
#     --start-mission

version: "1.0"
name: "Multi-Alarm Cascade Test"
description: "Tests multiple simultaneous alarms across subsystems"
target_id: "SIM-1"
step_rate_hz: 1.0

baseline:
  # HK packet
  HK.sc_mode: "NOMINAL"
  HK.uptime: 14400
  HK.cmd_recv_count: 500
  HK.cmd_exec_count: 498
  HK.cmd_reject_count: 2
  HK.error_count: 0
  HK.watchdog_timer: 120

  # THERM packet
  THERM.temp_obc: 30.0
  THERM.temp_battery: 25.0
  THERM.temp_solar_panel_1: 40.0
  THERM.temp_solar_panel_2: 40.0
  THERM.temp_payload: 15.0
  THERM.heater_1_state: "AUTO"
  THERM.heater_2_state: "AUTO"
  THERM.heater_power_total: 2.0
  THERM.thermal_mode: "ACTIVE"

  # EPS packet
  EPS.batt_voltage: 28.0
  EPS.batt_current: 2.0
  EPS.batt_soc: 90
  EPS.batt_temp: 25.0
  EPS.sa1_voltage: 32.0
  EPS.sa1_current: 4.0
  EPS.sa2_voltage: 32.0
  EPS.sa2_current: 4.0
  EPS.bus_3v3: 3.3
  EPS.bus_5v: 5.0
  EPS.bus_12v: 12.0
  EPS.total_power: 50.0
  EPS.eps_mode: "NOMINAL"
  EPS.eclipse_flag: "SUNLIT"

  # ADCS packet
  ADCS.roll: 0.0
  ADCS.pitch: 0.0
  ADCS.yaw: 0.0
  ADCS.roll_rate: 0.0
  ADCS.pitch_rate: 0.0
  ADCS.yaw_rate: 0.0
  ADCS.rw1_speed: 1000.0
  ADCS.rw2_speed: 1000.0
  ADCS.rw3_speed: 1000.0
  ADCS.adcs_mode: "NADIR_POINT"
  ADCS.adcs_error: "NONE"

  # COMM packet
  COMM.tx_power: 30.0
  COMM.rx_rssi: -90.0
  COMM.rx_snr: 15.0
  COMM.packets_tx: 10000
  COMM.packets_rx: 9500
  COMM.packets_err: 50
  COMM.link_state: "LOCKED"
  COMM.comm_mode: "FULL_DUPLEX"

timeline:
  # Phase 1: All systems nominal
  - step: 0
    description: "All systems nominal"

  # Phase 2: Eclipse entry - solar array degradation begins
  - step: 10
    description: "Eclipse entry - solar array output dropping"
    inject:
      EPS.eclipse_flag: "PENUMBRA"
      EPS.sa1_voltage:
        type: ramp
        from: 32.0
        to: 10.0
        steps: 15
        noise: 0.5
      EPS.sa1_current:
        type: ramp
        from: 4.0
        to: 0.5
        steps: 15
        noise: 0.2
      EPS.sa2_voltage:
        type: ramp
        from: 32.0
        to: 10.0
        steps: 15
        noise: 0.5
      EPS.sa2_current:
        type: ramp
        from: 4.0
        to: 0.5
        steps: 15
        noise: 0.2

  # Phase 3: Full eclipse - battery draining
  - step: 20
    description: "Full eclipse - battery under increased load"
    inject:
      EPS.eclipse_flag: "UMBRA"
      EPS.sa1_voltage: 0.0
      EPS.sa1_current: 0.0
      EPS.sa2_voltage: 0.0
      EPS.sa2_current: 0.0
      EPS.batt_voltage:
        type: ramp
        from: 28.0
        to: 24.5
        steps: 20
        noise: 0.2
      EPS.batt_current: -5.0  # Discharging
      EPS.batt_soc:
        type: ramp
        from: 90
        to: 50
        steps: 20

  # Phase 4: Thermal stress - heaters consuming power
  - step: 30
    description: "Thermal stress - heaters activating"
    inject:
      THERM.temp_obc:
        type: ramp
        from: 30.0
        to: 55.0
        steps: 20
        noise: 1.0
      THERM.temp_battery:
        type: ramp
        from: 25.0
        to: 5.0
        steps: 20
        noise: 0.5
      THERM.heater_1_state: "ON"
      THERM.heater_2_state: "ON"
      THERM.heater_power_total: 12.0
      EPS.total_power: 75.0

  # Phase 5: Attitude disturbance from power reduction
  - step: 40
    description: "Attitude control degraded - reduced power to ADCS"
    inject:
      ADCS.roll:
        type: sine
        from: -5.0
        to: 5.0
        steps: 30
        noise: 0.5
      ADCS.pitch:
        type: sine
        from: -3.0
        to: 3.0
        steps: 25
        noise: 0.3
      ADCS.roll_rate: 0.5
      ADCS.pitch_rate: 0.3
      ADCS.adcs_mode: "SAFE"
      HK.sc_mode: "SAFE"

  # Phase 6: Communications degraded
  - step: 45
    description: "Communications link degraded"
    inject:
      COMM.link_state: "DEGRADED"
      COMM.rx_rssi: -105.0
      COMM.rx_snr: 7.0
      COMM.packets_err:
        type: ramp
        from: 50
        to: 200
        steps: 10

  # Phase 7: Multiple alarms active - peak stress
  - step: 50
    description: "Multiple alarm conditions active - peak stress"
    inject:
      EPS.batt_voltage: 23.5  # Near yellow_low
      EPS.batt_soc: 25
      THERM.temp_obc: 62.0  # Above yellow_high
      THERM.temp_battery: 2.0  # Near yellow_low
      ADCS.roll: 8.0
      COMM.rx_rssi: -108.0  # Below yellow_low

  # Phase 8: Eclipse exit - recovery begins
  - step: 60
    description: "Eclipse exit - solar array recovery"
    inject:
      EPS.eclipse_flag: "PENUMBRA"
      EPS.sa1_voltage:
        type: ramp
        from: 0.0
        to: 32.0
        steps: 15
        noise: 0.5
      EPS.sa1_current:
        type: ramp
        from: 0.0
        to: 4.0
        steps: 15
      EPS.sa2_voltage:
        type: ramp
        from: 0.0
        to: 32.0
        steps: 15
        noise: 0.5
      EPS.sa2_current:
        type: ramp
        from: 0.0
        to: 4.0
        steps: 15
      EPS.batt_current: 3.0  # Charging

  # Phase 9: Systems stabilizing
  - step: 70
    description: "Systems stabilizing"
    inject:
      EPS.eclipse_flag: "SUNLIT"
      EPS.batt_voltage:
        type: ramp
        from: 23.5
        to: 28.0
        steps: 20
      EPS.batt_soc:
        type: ramp
        from: 25
        to: 80
        steps: 30
      THERM.temp_obc:
        type: ramp
        from: 62.0
        to: 30.0
        steps: 25
      THERM.temp_battery:
        type: ramp
        from: 2.0
        to: 25.0
        steps: 25
      THERM.heater_1_state: "AUTO"
      THERM.heater_2_state: "AUTO"
      THERM.heater_power_total: 2.0
      ADCS.roll:
        type: ramp
        from: 8.0
        to: 0.0
        steps: 20
      ADCS.pitch:
        type: ramp
        from: 3.0
        to: 0.0
        steps: 20
      ADCS.roll_rate: 0.0
      ADCS.pitch_rate: 0.0
      ADCS.adcs_mode: "NADIR_POINT"
      COMM.link_state: "LOCKED"
      COMM.rx_rssi: -90.0
      COMM.rx_snr: 15.0

  # Phase 10: All systems recovered
  - step: 95
    description: "All systems back to nominal"
    inject:
      EPS.batt_voltage: 28.0
      EPS.batt_soc: 85
      EPS.batt_current: 2.0
      EPS.total_power: 50.0
      EPS.eps_mode: "NOMINAL"
      THERM.temp_obc: 30.0
      THERM.temp_battery: 25.0
      THERM.thermal_mode: "ACTIVE"
      ADCS.adcs_error: "NONE"
      HK.sc_mode: "NOMINAL"

  - step: 105
    end: true
