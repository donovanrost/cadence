# OBC Temperature Spike Alarm Test Scenario
#
# This scenario tests temperature alarm behavior during a thermal spike event,
# simulating a temporary high-load condition that causes OBC temperature to
# spike and then return to normal. Tests:
# - Temperature warning alarm at 60C (yellow_high)
# - Temperature critical alarm at 80C (red_high)
# - Alarm clearing after temperature normalizes
#
# Uses demo_spacecraft.yaml packet definitions:
# - THERM packet (APID 10) for thermal telemetry
#
# Usage:
#   mix cadence.simulate -m <mission-id> \
#     --scenario priv/scenarios/thermal_spike.yaml \
#     --definitions priv/databases/demo_spacecraft.yaml \
#     --output tcp:localhost:9000 \
#     --start-mission

version: "1.0"
name: "OBC Temperature Spike Test"
description: "Tests temperature alarm during spike and recovery"
target_id: "SIM-1"
step_rate_hz: 1.0

baseline:
  # THERM packet baseline values
  THERM.temp_obc: 35.0
  THERM.temp_obc_raw: 2048
  THERM.temp_battery: 25.0
  THERM.temp_battery_raw: 1800
  THERM.temp_solar_panel_1: 45.0
  THERM.temp_solar_panel_2: 45.0
  THERM.temp_payload: 20.0
  THERM.heater_1_state: "OFF"
  THERM.heater_2_state: "OFF"
  THERM.heater_power_total: 0.0
  THERM.thermal_mode: "PASSIVE"

  # HK packet for context
  HK.sc_mode: "NOMINAL"
  HK.uptime: 7200

timeline:
  # Phase 1: Normal operation
  - step: 0
    description: "Normal operation - OBC at idle temperature"

  # Phase 2: Temperature spike begins
  - step: 10
    description: "High-load event - OBC temperature rising rapidly"
    inject:
      THERM.temp_obc:
        type: spike
        from: 35.0
        to: 85.0
        steps: 20
        noise: 2.0
      THERM.thermal_mode: "ACTIVE"
      THERM.heater_1_state: "OFF"  # Heaters off during high temp
      THERM.heater_2_state: "OFF"

  # Phase 3: Warning threshold crossed (60C yellow_high)
  - step: 18
    description: "Warning threshold crossed (60C)"

  # Phase 4: Peak temperature - critical threshold
  - step: 25
    description: "Peak temperature reached - critical alarm (80C)"
    inject:
      THERM.temp_obc: 85.0
      HK.sc_mode: "SAFE"  # Spacecraft enters safe mode due to thermal

  # Phase 5: Cooling begins
  - step: 30
    description: "Load reduced - cooling begins"
    inject:
      THERM.temp_obc:
        type: ramp
        from: 85.0
        to: 35.0
        steps: 20
        noise: 1.0
      THERM.thermal_mode: "PASSIVE"

  # Phase 6: Below warning threshold
  - step: 42
    description: "Temperature below warning threshold"

  # Phase 7: Return to normal
  - step: 50
    description: "Temperature back to normal"
    inject:
      THERM.temp_obc: 35.0
      HK.sc_mode: "NOMINAL"

  - step: 60
    end: true
