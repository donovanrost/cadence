# Battery Low Voltage Alarm Test Scenario
#
# This scenario tests the battery voltage alarm by gradually decreasing
# voltage from nominal to critical levels, allowing verification of:
# - Warning alarm triggering at 24.0V (yellow_low)
# - Critical alarm triggering at 22.0V (red_low)
# - Alarm clearing when voltage returns to nominal
#
# Uses demo_spacecraft.yaml packet definitions:
# - EPS packet (APID 20) for battery telemetry
#
# Usage:
#   mix cadence.simulate -m <mission-id> \
#     --scenario priv/scenarios/battery_low.yaml \
#     --definitions priv/databases/demo_spacecraft.yaml \
#     --output tcp:localhost:9000 \
#     --start-mission

version: "1.0"
name: "Battery Low Voltage Test"
description: "Tests battery voltage alarm triggering from nominal through warning to critical"
target_id: "SIM-1"
step_rate_hz: 1.0

baseline:
  # EPS packet baseline values
  EPS.batt_voltage: 28.0
  EPS.batt_current: 2.0
  EPS.batt_soc: 85
  EPS.batt_temp: 25.0
  EPS.sa1_voltage: 32.0
  EPS.sa1_current: 3.0
  EPS.sa2_voltage: 32.0
  EPS.sa2_current: 3.0
  EPS.bus_3v3: 3.3
  EPS.bus_5v: 5.0
  EPS.bus_12v: 12.0
  EPS.total_power: 45.0
  EPS.eps_mode: "NOMINAL"
  EPS.eclipse_flag: "SUNLIT"

  # HK packet for context
  HK.sc_mode: "NOMINAL"
  HK.uptime: 3600

timeline:
  # Phase 1: Normal operation (steps 0-9)
  - step: 0
    description: "Normal operation - all values nominal"
    hold_steps: 10

  # Phase 2: Voltage drops to warning level (steps 10-19)
  - step: 10
    description: "Battery voltage dropping to warning level (24.0V)"
    inject:
      EPS.batt_voltage:
        type: ramp
        from: 28.0
        to: 24.0
        steps: 5
        noise: 0.2
      EPS.batt_soc:
        type: ramp
        from: 85
        to: 40
        steps: 5

  # Phase 3: Hold at warning (steps 15-24)
  - step: 15
    description: "Holding at warning level"
    inject:
      EPS.batt_voltage: 24.0
      EPS.batt_soc: 40

  # Phase 4: Voltage drops to critical (steps 25-34)
  - step: 25
    description: "Battery voltage dropping to critical level (22.0V)"
    inject:
      EPS.batt_voltage:
        type: ramp
        from: 24.0
        to: 21.5
        steps: 5
        noise: 0.2
      EPS.batt_soc:
        type: ramp
        from: 40
        to: 15
        steps: 10
      EPS.eps_mode: "SAFE"

  # Phase 5: Hold at critical (steps 30-39)
  - step: 30
    description: "Holding at critical level"
    inject:
      EPS.batt_voltage: 21.5
      EPS.batt_soc: 15
      HK.sc_mode: "SAFE"

  # Phase 6: Recovery begins (steps 40-49)
  - step: 40
    description: "Battery recovery - voltage increasing (eclipse exit)"
    inject:
      EPS.batt_voltage:
        type: ramp
        from: 21.5
        to: 28.0
        steps: 10
        noise: 0.2
      EPS.batt_soc:
        type: ramp
        from: 15
        to: 85
        steps: 15
      EPS.batt_current: 4.0  # Charging
      EPS.eclipse_flag: "SUNLIT"

  # Phase 7: Back to nominal (steps 50-59)
  - step: 50
    description: "Back to nominal operation"
    inject:
      EPS.batt_voltage: 28.0
      EPS.batt_soc: 85
      EPS.batt_current: 2.0
      EPS.eps_mode: "NOMINAL"
      HK.sc_mode: "NOMINAL"

  # End scenario
  - step: 60
    end: true
