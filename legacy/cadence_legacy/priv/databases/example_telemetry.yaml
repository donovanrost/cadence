version: "1.0.1"
description: "Example telemetry database for spacecraft simulator"

packets:
  - name: HEALTH
    apid: 100
    description: "Health and status telemetry packet"
    items:
      - name: cpu_temp
        bit_offset: 0
        bit_size: 32
        data_type: float
        endianness: big
        units: "°C"
        description: "CPU temperature sensor"

      - name: battery_voltage
        bit_offset: 32
        bit_size: 32
        data_type: float
        endianness: big
        units: "V"
        description: "Main battery voltage"

      - name: battery_current
        bit_offset: 64
        bit_size: 32
        data_type: float
        endianness: big
        units: "A"
        description: "Main battery current draw"

      - name: battery_percentage
        bit_offset: 96
        bit_size: 8
        data_type: uint
        endianness: big
        units: "%"
        description: "Battery state of charge"

      - name: uptime_seconds
        bit_offset: 104
        bit_size: 32
        data_type: uint
        endianness: big
        units: "s"
        description: "System uptime in seconds"

      - name: memory_used_mb
        bit_offset: 136
        bit_size: 16
        data_type: uint
        endianness: big
        units: "MB"
        description: "Memory usage"


  - name: ATTITUDE
    apid: 101
    description: "Attitude determination and control telemetry"
    items:
      - name: roll
        bit_offset: 0
        bit_size: 32
        data_type: float
        endianness: big
        units: "deg"
        description: "Roll angle"

      - name: pitch
        bit_offset: 32
        bit_size: 32
        data_type: float
        endianness: big
        units: "deg"
        description: "Pitch angle"

      - name: yaw
        bit_offset: 64
        bit_size: 32
        data_type: float
        endianness: big
        units: "deg"
        description: "Yaw angle"

      - name: roll_rate
        bit_offset: 96
        bit_size: 32
        data_type: float
        endianness: big
        units: "deg/s"
        description: "Roll angular rate"

      - name: pitch_rate
        bit_offset: 128
        bit_size: 32
        data_type: float
        endianness: big
        units: "deg/s"
        description: "Pitch angular rate"

      - name: yaw_rate
        bit_offset: 160
        bit_size: 32
        data_type: float
        endianness: big
        units: "deg/s"
        description: "Yaw angular rate"

  - name: POWER
    apid: 102
    description: "Power subsystem telemetry"
    items:
      - name: solar_panel_voltage
        bit_offset: 0
        bit_size: 32
        data_type: float
        endianness: big
        units: "V"
        description: "Solar panel output voltage"

      - name: solar_panel_current
        bit_offset: 32
        bit_size: 32
        data_type: float
        endianness: big
        units: "A"
        description: "Solar panel output current"

      - name: bus_voltage
        bit_offset: 64
        bit_size: 32
        data_type: float
        endianness: big
        units: "V"
        description: "Main power bus voltage"

      - name: bus_current
        bit_offset: 96
        bit_size: 32
        data_type: float
        endianness: big
        units: "A"
        description: "Main power bus current"

      - name: power_mode
        bit_offset: 128
        bit_size: 8
        data_type: uint
        endianness: big
        description: "Power subsystem mode"
        conversion:
          type: state_table
          states:
            0: "OFF"
            1: "SAFE"
            2: "NOMINAL"
            3: "HIGH_POWER"
