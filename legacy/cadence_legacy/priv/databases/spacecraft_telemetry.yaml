version: "1.0.0"
description: "Comprehensive spacecraft telemetry database with limits for alarm testing"

packets:
  # =============================================================================
  # HEALTH - Core health and status (12 items)
  # =============================================================================
  - name: HEALTH
    apid: 100
    description: "Spacecraft health and status telemetry"
    items:
      - name: cpu_temp
        bit_offset: 0
        bit_size: 32
        data_type: float
        endianness: big
        units: "°C"
        description: "Onboard computer CPU temperature"
        limits:
          red_low: -40.0
          yellow_low: -20.0
          yellow_high: 70.0
          red_high: 85.0

      - name: cpu_usage
        bit_offset: 32
        bit_size: 8
        data_type: uint
        endianness: big
        units: "%"
        description: "CPU utilization percentage"
        limits:
          yellow_high: 80
          red_high: 95

      - name: memory_used
        bit_offset: 40
        bit_size: 16
        data_type: uint
        endianness: big
        units: "MB"
        description: "RAM usage in megabytes"
        limits:
          yellow_high: 3500
          red_high: 3900

      - name: memory_total
        bit_offset: 56
        bit_size: 16
        data_type: uint
        endianness: big
        units: "MB"
        description: "Total RAM capacity"

      - name: uptime_seconds
        bit_offset: 72
        bit_size: 32
        data_type: uint
        endianness: big
        units: "s"
        description: "System uptime since last boot"

      - name: boot_count
        bit_offset: 104
        bit_size: 16
        data_type: uint
        endianness: big
        description: "Total boot count since deployment"

      - name: watchdog_timer
        bit_offset: 120
        bit_size: 16
        data_type: uint
        endianness: big
        units: "s"
        description: "Watchdog timer countdown"
        limits:
          red_low: 5
          yellow_low: 30

      - name: last_command_id
        bit_offset: 136
        bit_size: 16
        data_type: uint
        endianness: big
        description: "ID of last executed command"

      - name: command_count
        bit_offset: 152
        bit_size: 32
        data_type: uint
        endianness: big
        description: "Total commands received"

      - name: error_count
        bit_offset: 184
        bit_size: 16
        data_type: uint
        endianness: big
        description: "System error counter"
        limits:
          yellow_high: 10
          red_high: 50

      - name: spacecraft_mode
        bit_offset: 200
        bit_size: 8
        data_type: uint
        endianness: big
        description: "Current spacecraft operational mode"
        conversion:
          type: state_table
          states:
            0: "SAFE"
            1: "STANDBY"
            2: "NOMINAL"
            3: "SCIENCE"
            4: "MANEUVER"
            5: "EMERGENCY"

      - name: mode_duration
        bit_offset: 208
        bit_size: 32
        data_type: uint
        endianness: big
        units: "s"
        description: "Time in current mode"

  # =============================================================================
  # EPS - Electrical Power System (18 items)
  # =============================================================================
  - name: EPS
    apid: 101
    description: "Electrical Power System telemetry"
    items:
      - name: battery_voltage
        bit_offset: 0
        bit_size: 32
        data_type: float
        endianness: big
        units: "V"
        description: "Main battery voltage"
        limits:
          red_low: 22.0
          yellow_low: 24.0
          yellow_high: 32.0
          red_high: 33.5

      - name: battery_current
        bit_offset: 32
        bit_size: 32
        data_type: float
        endianness: big
        units: "A"
        description: "Battery current (positive=charging)"
        limits:
          red_low: -15.0
          yellow_low: -10.0
          yellow_high: 10.0
          red_high: 15.0

      - name: battery_soc
        bit_offset: 64
        bit_size: 8
        data_type: uint
        endianness: big
        units: "%"
        description: "Battery state of charge"
        limits:
          red_low: 10
          yellow_low: 20
          yellow_high: 98
          red_high: 100

      - name: battery_temp
        bit_offset: 72
        bit_size: 32
        data_type: float
        endianness: big
        units: "°C"
        description: "Battery pack temperature"
        limits:
          red_low: -10.0
          yellow_low: 0.0
          yellow_high: 40.0
          red_high: 50.0

      - name: battery_cycles
        bit_offset: 104
        bit_size: 16
        data_type: uint
        endianness: big
        description: "Battery charge/discharge cycles"
        limits:
          yellow_high: 5000
          red_high: 7500

      - name: solar_panel_1_voltage
        bit_offset: 120
        bit_size: 32
        data_type: float
        endianness: big
        units: "V"
        description: "Solar panel 1 output voltage"
        limits:
          yellow_low: 15.0
          red_low: 10.0

      - name: solar_panel_1_current
        bit_offset: 152
        bit_size: 32
        data_type: float
        endianness: big
        units: "A"
        description: "Solar panel 1 output current"

      - name: solar_panel_1_temp
        bit_offset: 184
        bit_size: 32
        data_type: float
        endianness: big
        units: "°C"
        description: "Solar panel 1 temperature"
        limits:
          red_low: -150.0
          yellow_low: -100.0
          yellow_high: 100.0
          red_high: 150.0

      - name: solar_panel_2_voltage
        bit_offset: 216
        bit_size: 32
        data_type: float
        endianness: big
        units: "V"
        description: "Solar panel 2 output voltage"
        limits:
          yellow_low: 15.0
          red_low: 10.0

      - name: solar_panel_2_current
        bit_offset: 248
        bit_size: 32
        data_type: float
        endianness: big
        units: "A"
        description: "Solar panel 2 output current"

      - name: solar_panel_2_temp
        bit_offset: 280
        bit_size: 32
        data_type: float
        endianness: big
        units: "°C"
        description: "Solar panel 2 temperature"
        limits:
          red_low: -150.0
          yellow_low: -100.0
          yellow_high: 100.0
          red_high: 150.0

      - name: bus_voltage_3v3
        bit_offset: 312
        bit_size: 32
        data_type: float
        endianness: big
        units: "V"
        description: "3.3V power bus voltage"
        limits:
          red_low: 3.1
          yellow_low: 3.2
          yellow_high: 3.4
          red_high: 3.5

      - name: bus_voltage_5v
        bit_offset: 344
        bit_size: 32
        data_type: float
        endianness: big
        units: "V"
        description: "5V power bus voltage"
        limits:
          red_low: 4.7
          yellow_low: 4.8
          yellow_high: 5.2
          red_high: 5.3

      - name: bus_voltage_12v
        bit_offset: 376
        bit_size: 32
        data_type: float
        endianness: big
        units: "V"
        description: "12V power bus voltage"
        limits:
          red_low: 11.4
          yellow_low: 11.6
          yellow_high: 12.4
          red_high: 12.6

      - name: total_power_draw
        bit_offset: 408
        bit_size: 32
        data_type: float
        endianness: big
        units: "W"
        description: "Total spacecraft power consumption"
        limits:
          yellow_high: 80.0
          red_high: 100.0

      - name: power_mode
        bit_offset: 440
        bit_size: 8
        data_type: uint
        endianness: big
        description: "EPS operational mode"
        conversion:
          type: state_table
          states:
            0: "OFF"
            1: "SAFE"
            2: "NOMINAL"
            3: "HIGH_POWER"
            4: "ECLIPSE"

      - name: eclipse_flag
        bit_offset: 448
        bit_size: 8
        data_type: uint
        endianness: big
        description: "Eclipse status (1=in eclipse)"
        conversion:
          type: state_table
          states:
            0: "SUNLIT"
            1: "ECLIPSE"

      - name: eclipse_duration
        bit_offset: 456
        bit_size: 16
        data_type: uint
        endianness: big
        units: "s"
        description: "Time in current eclipse/sunlit state"

  # =============================================================================
  # ADCS - Attitude Determination and Control (22 items)
  # =============================================================================
  - name: ADCS
    apid: 102
    description: "Attitude Determination and Control System telemetry"
    items:
      - name: quaternion_w
        bit_offset: 0
        bit_size: 32
        data_type: float
        endianness: big
        description: "Attitude quaternion W component"

      - name: quaternion_x
        bit_offset: 32
        bit_size: 32
        data_type: float
        endianness: big
        description: "Attitude quaternion X component"

      - name: quaternion_y
        bit_offset: 64
        bit_size: 32
        data_type: float
        endianness: big
        description: "Attitude quaternion Y component"

      - name: quaternion_z
        bit_offset: 96
        bit_size: 32
        data_type: float
        endianness: big
        description: "Attitude quaternion Z component"

      - name: roll
        bit_offset: 128
        bit_size: 32
        data_type: float
        endianness: big
        units: "deg"
        description: "Euler roll angle"
        limits:
          red_low: -180.0
          yellow_low: -45.0
          yellow_high: 45.0
          red_high: 180.0

      - name: pitch
        bit_offset: 160
        bit_size: 32
        data_type: float
        endianness: big
        units: "deg"
        description: "Euler pitch angle"
        limits:
          red_low: -90.0
          yellow_low: -30.0
          yellow_high: 30.0
          red_high: 90.0

      - name: yaw
        bit_offset: 192
        bit_size: 32
        data_type: float
        endianness: big
        units: "deg"
        description: "Euler yaw angle"
        limits:
          red_low: -180.0
          yellow_low: -45.0
          yellow_high: 45.0
          red_high: 180.0

      - name: roll_rate
        bit_offset: 224
        bit_size: 32
        data_type: float
        endianness: big
        units: "deg/s"
        description: "Angular rate around X axis"
        limits:
          red_low: -5.0
          yellow_low: -2.0
          yellow_high: 2.0
          red_high: 5.0

      - name: pitch_rate
        bit_offset: 256
        bit_size: 32
        data_type: float
        endianness: big
        units: "deg/s"
        description: "Angular rate around Y axis"
        limits:
          red_low: -5.0
          yellow_low: -2.0
          yellow_high: 2.0
          red_high: 5.0

      - name: yaw_rate
        bit_offset: 288
        bit_size: 32
        data_type: float
        endianness: big
        units: "deg/s"
        description: "Angular rate around Z axis"
        limits:
          red_low: -5.0
          yellow_low: -2.0
          yellow_high: 2.0
          red_high: 5.0

      - name: sun_vector_x
        bit_offset: 320
        bit_size: 32
        data_type: float
        endianness: big
        description: "Sun vector X component (body frame)"

      - name: sun_vector_y
        bit_offset: 352
        bit_size: 32
        data_type: float
        endianness: big
        description: "Sun vector Y component (body frame)"

      - name: sun_vector_z
        bit_offset: 384
        bit_size: 32
        data_type: float
        endianness: big
        description: "Sun vector Z component (body frame)"

      - name: sun_angle
        bit_offset: 416
        bit_size: 32
        data_type: float
        endianness: big
        units: "deg"
        description: "Angle to sun from +Z axis"
        limits:
          yellow_high: 60.0
          red_high: 90.0

      - name: reaction_wheel_1_speed
        bit_offset: 448
        bit_size: 32
        data_type: float
        endianness: big
        units: "RPM"
        description: "Reaction wheel 1 angular velocity"
        limits:
          red_low: -6000.0
          yellow_low: -5000.0
          yellow_high: 5000.0
          red_high: 6000.0

      - name: reaction_wheel_2_speed
        bit_offset: 480
        bit_size: 32
        data_type: float
        endianness: big
        units: "RPM"
        description: "Reaction wheel 2 angular velocity"
        limits:
          red_low: -6000.0
          yellow_low: -5000.0
          yellow_high: 5000.0
          red_high: 6000.0

      - name: reaction_wheel_3_speed
        bit_offset: 512
        bit_size: 32
        data_type: float
        endianness: big
        units: "RPM"
        description: "Reaction wheel 3 angular velocity"
        limits:
          red_low: -6000.0
          yellow_low: -5000.0
          yellow_high: 5000.0
          red_high: 6000.0

      - name: reaction_wheel_4_speed
        bit_offset: 544
        bit_size: 32
        data_type: float
        endianness: big
        units: "RPM"
        description: "Reaction wheel 4 angular velocity (redundant)"
        limits:
          red_low: -6000.0
          yellow_low: -5000.0
          yellow_high: 5000.0
          red_high: 6000.0

      - name: magnetorquer_x_current
        bit_offset: 576
        bit_size: 32
        data_type: float
        endianness: big
        units: "A"
        description: "Magnetorquer X axis current"
        limits:
          red_low: -0.5
          yellow_low: -0.4
          yellow_high: 0.4
          red_high: 0.5

      - name: magnetorquer_y_current
        bit_offset: 608
        bit_size: 32
        data_type: float
        endianness: big
        units: "A"
        description: "Magnetorquer Y axis current"
        limits:
          red_low: -0.5
          yellow_low: -0.4
          yellow_high: 0.4
          red_high: 0.5

      - name: magnetorquer_z_current
        bit_offset: 640
        bit_size: 32
        data_type: float
        endianness: big
        units: "A"
        description: "Magnetorquer Z axis current"
        limits:
          red_low: -0.5
          yellow_low: -0.4
          yellow_high: 0.4
          red_high: 0.5

      - name: adcs_mode
        bit_offset: 672
        bit_size: 8
        data_type: uint
        endianness: big
        description: "ADCS operational mode"
        conversion:
          type: state_table
          states:
            0: "OFF"
            1: "DETUMBLE"
            2: "SUN_POINTING"
            3: "NADIR_POINTING"
            4: "TARGET_TRACKING"
            5: "SAFE"

  # =============================================================================
  # THERMAL - Thermal Control System (15 items)
  # =============================================================================
  - name: THERMAL
    apid: 103
    description: "Thermal Control System telemetry"
    items:
      - name: obc_temp
        bit_offset: 0
        bit_size: 32
        data_type: float
        endianness: big
        units: "°C"
        description: "Onboard computer temperature"
        limits:
          red_low: -40.0
          yellow_low: -20.0
          yellow_high: 60.0
          red_high: 80.0

      - name: eps_temp
        bit_offset: 32
        bit_size: 32
        data_type: float
        endianness: big
        units: "°C"
        description: "EPS board temperature"
        limits:
          red_low: -40.0
          yellow_low: -20.0
          yellow_high: 60.0
          red_high: 80.0

      - name: adcs_temp
        bit_offset: 64
        bit_size: 32
        data_type: float
        endianness: big
        units: "°C"
        description: "ADCS board temperature"
        limits:
          red_low: -40.0
          yellow_low: -20.0
          yellow_high: 60.0
          red_high: 80.0

      - name: comm_temp
        bit_offset: 96
        bit_size: 32
        data_type: float
        endianness: big
        units: "°C"
        description: "Communication system temperature"
        limits:
          red_low: -40.0
          yellow_low: -20.0
          yellow_high: 60.0
          red_high: 80.0

      - name: payload_temp
        bit_offset: 128
        bit_size: 32
        data_type: float
        endianness: big
        units: "°C"
        description: "Payload bay temperature"
        limits:
          red_low: -30.0
          yellow_low: -10.0
          yellow_high: 45.0
          red_high: 55.0

      - name: structure_temp_1
        bit_offset: 160
        bit_size: 32
        data_type: float
        endianness: big
        units: "°C"
        description: "Structure panel 1 temperature"
        limits:
          red_low: -80.0
          yellow_low: -60.0
          yellow_high: 80.0
          red_high: 100.0

      - name: structure_temp_2
        bit_offset: 192
        bit_size: 32
        data_type: float
        endianness: big
        units: "°C"
        description: "Structure panel 2 temperature"
        limits:
          red_low: -80.0
          yellow_low: -60.0
          yellow_high: 80.0
          red_high: 100.0

      - name: structure_temp_3
        bit_offset: 224
        bit_size: 32
        data_type: float
        endianness: big
        units: "°C"
        description: "Structure panel 3 temperature"
        limits:
          red_low: -80.0
          yellow_low: -60.0
          yellow_high: 80.0
          red_high: 100.0

      - name: structure_temp_4
        bit_offset: 256
        bit_size: 32
        data_type: float
        endianness: big
        units: "°C"
        description: "Structure panel 4 temperature"
        limits:
          red_low: -80.0
          yellow_low: -60.0
          yellow_high: 80.0
          red_high: 100.0

      - name: heater_1_state
        bit_offset: 288
        bit_size: 8
        data_type: uint
        endianness: big
        description: "Heater 1 on/off state"
        conversion:
          type: state_table
          states:
            0: "OFF"
            1: "ON"

      - name: heater_1_duty_cycle
        bit_offset: 296
        bit_size: 8
        data_type: uint
        endianness: big
        units: "%"
        description: "Heater 1 PWM duty cycle"

      - name: heater_2_state
        bit_offset: 304
        bit_size: 8
        data_type: uint
        endianness: big
        description: "Heater 2 on/off state"
        conversion:
          type: state_table
          states:
            0: "OFF"
            1: "ON"

      - name: heater_2_duty_cycle
        bit_offset: 312
        bit_size: 8
        data_type: uint
        endianness: big
        units: "%"
        description: "Heater 2 PWM duty cycle"

      - name: heater_power_total
        bit_offset: 320
        bit_size: 32
        data_type: float
        endianness: big
        units: "W"
        description: "Total heater power consumption"
        limits:
          yellow_high: 15.0
          red_high: 20.0

      - name: thermal_mode
        bit_offset: 352
        bit_size: 8
        data_type: uint
        endianness: big
        description: "Thermal control mode"
        conversion:
          type: state_table
          states:
            0: "OFF"
            1: "PASSIVE"
            2: "ACTIVE"
            3: "SURVIVAL"

  # =============================================================================
  # COMM - Communications System (16 items)
  # =============================================================================
  - name: COMM
    apid: 104
    description: "Communications System telemetry"
    items:
      - name: tx_power
        bit_offset: 0
        bit_size: 32
        data_type: float
        endianness: big
        units: "dBm"
        description: "Transmitter output power"
        limits:
          red_low: 25.0
          yellow_low: 27.0
          yellow_high: 33.0
          red_high: 35.0

      - name: tx_frequency
        bit_offset: 32
        bit_size: 32
        data_type: float
        endianness: big
        units: "MHz"
        description: "Transmit frequency"

      - name: tx_temp
        bit_offset: 64
        bit_size: 32
        data_type: float
        endianness: big
        units: "°C"
        description: "Transmitter temperature"
        limits:
          red_low: -30.0
          yellow_low: -10.0
          yellow_high: 60.0
          red_high: 75.0

      - name: rx_rssi
        bit_offset: 96
        bit_size: 32
        data_type: float
        endianness: big
        units: "dBm"
        description: "Received signal strength indicator"
        limits:
          red_low: -120.0
          yellow_low: -110.0

      - name: rx_snr
        bit_offset: 128
        bit_size: 32
        data_type: float
        endianness: big
        units: "dB"
        description: "Signal to noise ratio"
        limits:
          red_low: 3.0
          yellow_low: 6.0

      - name: rx_frequency
        bit_offset: 160
        bit_size: 32
        data_type: float
        endianness: big
        units: "MHz"
        description: "Receive frequency"

      - name: rx_temp
        bit_offset: 192
        bit_size: 32
        data_type: float
        endianness: big
        units: "°C"
        description: "Receiver temperature"
        limits:
          red_low: -30.0
          yellow_low: -10.0
          yellow_high: 60.0
          red_high: 75.0

      - name: packets_sent
        bit_offset: 224
        bit_size: 32
        data_type: uint
        endianness: big
        description: "Total packets transmitted"

      - name: packets_received
        bit_offset: 256
        bit_size: 32
        data_type: uint
        endianness: big
        description: "Total packets received"

      - name: packets_dropped
        bit_offset: 288
        bit_size: 32
        data_type: uint
        endianness: big
        description: "Packets dropped due to errors"
        limits:
          yellow_high: 100
          red_high: 500

      - name: bit_error_rate
        bit_offset: 320
        bit_size: 32
        data_type: float
        endianness: big
        description: "Current bit error rate"
        limits:
          yellow_high: 0.001
          red_high: 0.01

      - name: data_rate
        bit_offset: 352
        bit_size: 32
        data_type: float
        endianness: big
        units: "kbps"
        description: "Current data rate"

      - name: antenna_deployed
        bit_offset: 384
        bit_size: 8
        data_type: uint
        endianness: big
        description: "Antenna deployment status"
        conversion:
          type: state_table
          states:
            0: "STOWED"
            1: "DEPLOYING"
            2: "DEPLOYED"
            3: "FAILED"

      - name: link_active
        bit_offset: 392
        bit_size: 8
        data_type: uint
        endianness: big
        description: "Communication link status"
        conversion:
          type: state_table
          states:
            0: "NO_LINK"
            1: "ACQUIRING"
            2: "ACTIVE"

      - name: last_contact
        bit_offset: 400
        bit_size: 32
        data_type: uint
        endianness: big
        units: "s"
        description: "Seconds since last ground contact"
        limits:
          yellow_high: 86400
          red_high: 172800

      - name: comm_mode
        bit_offset: 432
        bit_size: 8
        data_type: uint
        endianness: big
        description: "Communications mode"
        conversion:
          type: state_table
          states:
            0: "OFF"
            1: "RX_ONLY"
            2: "TX_ONLY"
            3: "FULL_DUPLEX"
            4: "BEACON"

  # =============================================================================
  # GPS - Global Positioning System (14 items)
  # =============================================================================
  - name: GPS
    apid: 105
    description: "GPS Receiver telemetry"
    items:
      - name: latitude
        bit_offset: 0
        bit_size: 64
        data_type: float
        endianness: big
        units: "deg"
        description: "Geodetic latitude"

      - name: longitude
        bit_offset: 64
        bit_size: 64
        data_type: float
        endianness: big
        units: "deg"
        description: "Geodetic longitude"

      - name: altitude
        bit_offset: 128
        bit_size: 32
        data_type: float
        endianness: big
        units: "km"
        description: "Altitude above WGS84 ellipsoid"
        limits:
          red_low: 250.0
          yellow_low: 300.0
          yellow_high: 600.0
          red_high: 700.0

      - name: velocity_x
        bit_offset: 160
        bit_size: 32
        data_type: float
        endianness: big
        units: "m/s"
        description: "Velocity X component (ECEF)"

      - name: velocity_y
        bit_offset: 192
        bit_size: 32
        data_type: float
        endianness: big
        units: "m/s"
        description: "Velocity Y component (ECEF)"

      - name: velocity_z
        bit_offset: 224
        bit_size: 32
        data_type: float
        endianness: big
        units: "m/s"
        description: "Velocity Z component (ECEF)"

      - name: ground_speed
        bit_offset: 256
        bit_size: 32
        data_type: float
        endianness: big
        units: "m/s"
        description: "Ground track speed"
        limits:
          red_low: 7200.0
          yellow_low: 7400.0
          yellow_high: 7800.0
          red_high: 8000.0

      - name: satellites_visible
        bit_offset: 288
        bit_size: 8
        data_type: uint
        endianness: big
        description: "Number of visible GPS satellites"
        limits:
          red_low: 2
          yellow_low: 4

      - name: satellites_tracked
        bit_offset: 296
        bit_size: 8
        data_type: uint
        endianness: big
        description: "Number of tracked GPS satellites"
        limits:
          red_low: 2
          yellow_low: 4

      - name: hdop
        bit_offset: 304
        bit_size: 32
        data_type: float
        endianness: big
        description: "Horizontal dilution of precision"
        limits:
          yellow_high: 5.0
          red_high: 10.0

      - name: pdop
        bit_offset: 336
        bit_size: 32
        data_type: float
        endianness: big
        description: "Position dilution of precision"
        limits:
          yellow_high: 6.0
          red_high: 12.0

      - name: fix_type
        bit_offset: 368
        bit_size: 8
        data_type: uint
        endianness: big
        description: "GPS fix type"
        conversion:
          type: state_table
          states:
            0: "NO_FIX"
            1: "2D_FIX"
            2: "3D_FIX"
            3: "DGPS"

      - name: time_since_fix
        bit_offset: 376
        bit_size: 16
        data_type: uint
        endianness: big
        units: "s"
        description: "Time since last valid fix"
        limits:
          yellow_high: 60
          red_high: 300

      - name: gps_week
        bit_offset: 392
        bit_size: 16
        data_type: uint
        endianness: big
        description: "GPS week number"

  # =============================================================================
  # PAYLOAD - Science Payload (10 items)
  # =============================================================================
  - name: PAYLOAD
    apid: 106
    description: "Science Payload telemetry"
    items:
      - name: payload_state
        bit_offset: 0
        bit_size: 8
        data_type: uint
        endianness: big
        description: "Payload operational state"
        conversion:
          type: state_table
          states:
            0: "OFF"
            1: "STANDBY"
            2: "WARMING_UP"
            3: "COLLECTING"
            4: "PROCESSING"
            5: "ERROR"

      - name: detector_temp
        bit_offset: 8
        bit_size: 32
        data_type: float
        endianness: big
        units: "°C"
        description: "Detector temperature"
        limits:
          red_low: -50.0
          yellow_low: -45.0
          yellow_high: -35.0
          red_high: -30.0

      - name: detector_voltage
        bit_offset: 40
        bit_size: 32
        data_type: float
        endianness: big
        units: "V"
        description: "Detector bias voltage"
        limits:
          red_low: 95.0
          yellow_low: 98.0
          yellow_high: 102.0
          red_high: 105.0

      - name: detector_current
        bit_offset: 72
        bit_size: 32
        data_type: float
        endianness: big
        units: "mA"
        description: "Detector current"
        limits:
          yellow_high: 50.0
          red_high: 75.0

      - name: data_collected
        bit_offset: 104
        bit_size: 32
        data_type: uint
        endianness: big
        units: "MB"
        description: "Data collected this session"

      - name: data_stored
        bit_offset: 136
        bit_size: 32
        data_type: uint
        endianness: big
        units: "MB"
        description: "Total data in storage"
        limits:
          yellow_high: 28000
          red_high: 31000

      - name: storage_capacity
        bit_offset: 168
        bit_size: 32
        data_type: uint
        endianness: big
        units: "MB"
        description: "Total storage capacity"

      - name: collection_count
        bit_offset: 200
        bit_size: 16
        data_type: uint
        endianness: big
        description: "Number of data collections completed"

      - name: error_count
        bit_offset: 216
        bit_size: 16
        data_type: uint
        endianness: big
        description: "Payload error counter"
        limits:
          yellow_high: 5
          red_high: 20

      - name: power_draw
        bit_offset: 232
        bit_size: 32
        data_type: float
        endianness: big
        units: "W"
        description: "Payload power consumption"
        limits:
          yellow_high: 25.0
          red_high: 30.0

  # =============================================================================
  # STORAGE - Data Storage System (8 items)
  # =============================================================================
  - name: STORAGE
    apid: 107
    description: "Data Storage System telemetry"
    items:
      - name: flash_used
        bit_offset: 0
        bit_size: 32
        data_type: uint
        endianness: big
        units: "MB"
        description: "Flash storage used"
        limits:
          yellow_high: 28000
          red_high: 31000

      - name: flash_total
        bit_offset: 32
        bit_size: 32
        data_type: uint
        endianness: big
        units: "MB"
        description: "Flash storage total capacity"

      - name: write_count
        bit_offset: 64
        bit_size: 32
        data_type: uint
        endianness: big
        description: "Total write operations"

      - name: read_count
        bit_offset: 96
        bit_size: 32
        data_type: uint
        endianness: big
        description: "Total read operations"

      - name: bad_blocks
        bit_offset: 128
        bit_size: 16
        data_type: uint
        endianness: big
        description: "Number of bad flash blocks"
        limits:
          yellow_high: 50
          red_high: 200

      - name: write_errors
        bit_offset: 144
        bit_size: 16
        data_type: uint
        endianness: big
        description: "Write error count"
        limits:
          yellow_high: 10
          red_high: 50

      - name: read_errors
        bit_offset: 160
        bit_size: 16
        data_type: uint
        endianness: big
        description: "Read error count"
        limits:
          yellow_high: 10
          red_high: 50

      - name: flash_temp
        bit_offset: 176
        bit_size: 32
        data_type: float
        endianness: big
        units: "°C"
        description: "Flash memory temperature"
        limits:
          red_low: -40.0
          yellow_low: -20.0
          yellow_high: 70.0
          red_high: 85.0

# =============================================================================
# Commands
# =============================================================================
commands:
  - name: REBOOT
    opcode: 0x01
    description: "Reboot the spacecraft computer"
    is_hazardous: true
    hazard_description: "Will cause temporary loss of control"
    requires_confirmation: true

  - name: SAFE_MODE
    opcode: 0x02
    description: "Enter safe mode"
    is_hazardous: true
    hazard_description: "Will disable normal operations and science collection"
    requires_confirmation: true

  - name: SET_SPACECRAFT_MODE
    opcode: 0x03
    description: "Set spacecraft operational mode"
    parameters:
      - name: mode
        data_type: uint
        required: true
        bit_offset: 0
        bit_length: 8
        valid_values: [0, 1, 2, 3, 4, 5]
        description: "Mode (0=SAFE, 1=STANDBY, 2=NOMINAL, 3=SCIENCE, 4=MANEUVER, 5=EMERGENCY)"

  - name: SET_HEATER
    opcode: 0x10
    description: "Control heater state"
    parameters:
      - name: heater_id
        data_type: uint
        required: true
        bit_offset: 0
        bit_length: 8
        valid_values: [1, 2]
        description: "Heater ID (1 or 2)"
      - name: state
        data_type: uint
        required: true
        bit_offset: 8
        bit_length: 8
        valid_values: [0, 1]
        description: "State (0=OFF, 1=ON)"
      - name: duty_cycle
        data_type: uint
        required: false
        bit_offset: 16
        bit_length: 8
        min_value: 0
        max_value: 100
        default_value: 100
        units: "%"
        description: "PWM duty cycle"

  - name: SET_TX_POWER
    opcode: 0x20
    description: "Set transmitter power level"
    parameters:
      - name: power_dbm
        data_type: float
        required: true
        bit_offset: 0
        bit_length: 32
        min_value: 20.0
        max_value: 35.0
        units: "dBm"
        description: "Transmit power in dBm"

  - name: START_PAYLOAD
    opcode: 0x30
    description: "Start payload data collection"
    parameters:
      - name: duration_seconds
        data_type: uint
        required: true
        bit_offset: 0
        bit_length: 32
        min_value: 10
        max_value: 3600
        units: "s"
        description: "Collection duration"
      - name: mode
        data_type: uint
        required: false
        bit_offset: 32
        bit_length: 8
        valid_values: [0, 1, 2]
        default_value: 0
        description: "Collection mode (0=NORMAL, 1=HIGH_RES, 2=BURST)"

  - name: STOP_PAYLOAD
    opcode: 0x31
    description: "Stop payload data collection"

  - name: SET_ADCS_MODE
    opcode: 0x40
    description: "Set ADCS operational mode"
    parameters:
      - name: mode
        data_type: uint
        required: true
        bit_offset: 0
        bit_length: 8
        valid_values: [0, 1, 2, 3, 4, 5]
        description: "Mode (0=OFF, 1=DETUMBLE, 2=SUN_POINTING, 3=NADIR_POINTING, 4=TARGET_TRACKING, 5=SAFE)"

  - name: SLEW_TO_TARGET
    opcode: 0x41
    description: "Slew to specified attitude"
    parameters:
      - name: target_roll
        data_type: float
        required: true
        bit_offset: 0
        bit_length: 32
        min_value: -180.0
        max_value: 180.0
        units: "deg"
        description: "Target roll angle"
      - name: target_pitch
        data_type: float
        required: true
        bit_offset: 32
        bit_length: 32
        min_value: -90.0
        max_value: 90.0
        units: "deg"
        description: "Target pitch angle"
      - name: target_yaw
        data_type: float
        required: true
        bit_offset: 64
        bit_length: 32
        min_value: -180.0
        max_value: 180.0
        units: "deg"
        description: "Target yaw angle"

  - name: CLEAR_ERRORS
    opcode: 0x50
    description: "Clear error counters"
    parameters:
      - name: subsystem
        data_type: uint
        required: false
        bit_offset: 0
        bit_length: 8
        valid_values: [0, 1, 2, 3, 4, 5, 6, 7, 255]
        default_value: 255
        description: "Subsystem (0=HEALTH, 1=EPS, 2=ADCS, 3=THERMAL, 4=COMM, 5=GPS, 6=PAYLOAD, 7=STORAGE, 255=ALL)"

  - name: DOWNLOAD_DATA
    opcode: 0x60
    description: "Schedule data download"
    parameters:
      - name: start_address
        data_type: uint
        required: true
        bit_offset: 0
        bit_length: 32
        description: "Start address in storage"
      - name: length
        data_type: uint
        required: true
        bit_offset: 32
        bit_length: 32
        units: "bytes"
        description: "Number of bytes to download"

  - name: FORMAT_STORAGE
    opcode: 0x61
    description: "Format data storage"
    is_hazardous: true
    hazard_description: "Will permanently delete all stored data"
    requires_confirmation: true
